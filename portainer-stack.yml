version: '3.8'

services:
  streaming-app:
    image: streaming-platform:latest
    container_name: streaming-platform
    restart: unless-stopped
    ports:
      - "5000:5000"   # Web interface
      - "1935:1935"   # RTMP input
      - "8000:8000"   # HLS output
    volumes:
      - /opt/streaming/recordings:/app/recordings
      - /opt/streaming/media:/app/media
      - /opt/streaming/uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://streaming_user:${POSTGRES_PASSWORD}@postgres:5432/streaming_db
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=streaming_user
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=streaming_db
    depends_on:
      - postgres
    networks:
      - streaming-network
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  postgres:
    image: postgres:15
    container_name: streaming-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=streaming_db
      - POSTGRES_USER=streaming_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streaming_user -d streaming_db"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - streaming-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data:

networks:
  streaming-network:
    driver: bridge