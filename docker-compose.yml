version: '3.8'

services:
  streaming-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: streaming-platform
    restart: unless-stopped
    ports:
      - "5000:5000"   # Web interface
      - "1935:1935"   # RTMP input
      - "8000:8000"   # HLS output
    volumes:
      - ./recordings:/app/recordings
      - ./media:/app/media
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://streaming_user:streaming_pass@postgres:5432/streaming_db
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=streaming_user
      - PGPASSWORD=streaming_pass
      - PGDATABASE=streaming_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - streaming-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/streams"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  postgres:
    image: postgres:15
    container_name: streaming-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=streaming_db
      - POSTGRES_USER=streaming_user
      - POSTGRES_PASSWORD=streaming_pass
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streaming_user -d streaming_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streaming-network

volumes:
  postgres_data:

networks:
  streaming-network:
    driver: bridge
